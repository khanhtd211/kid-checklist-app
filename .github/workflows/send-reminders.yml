name: Gửi thông báo nhắc nhở checklist

on:
  # KHÔNG dùng schedule: (lịch cron nội bộ của GitHub Actions) nữa — đã xác nhận
  # thực tế nhiều lần bị GitHub âm thầm bỏ qua hàng chục tiếng liền dù workflow ở
  # trạng thái active (xem PROGRESS.md). Thay bằng dịch vụ cron ngoài (cron-job.org)
  # gọi API workflow_dispatch dưới đây theo đúng giờ thật, đáng tin cậy hơn hẳn.
  # Mỗi khung giờ có nhiều lần gọi rải rác (mỗi 15 phút) từ cron-job.org, script
  # bên dưới tự chọn 1 thời điểm ngẫu nhiên trong khung để gửi — giữ đúng cảm giác
  # "bất ngờ" như thiết kế ban đầu, chỉ đổi nguồn trigger cho đáng tin cậy hơn.
  workflow_dispatch:
    inputs:
      window:
        description: 'Khung giờ để test thủ công'
        required: true
        default: 'afternoon'
        type: choice
        options:
          - weekend_morning
          - afternoon
          - evening
      force_send:
        description: 'Bỏ qua kiểm tra giờ/đã gửi hôm nay (chỉ dùng để test — lưu ý sẽ tính là "đã gửi hôm nay" luôn)'
        required: true
        default: true
        type: boolean

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cài thư viện
        working-directory: .github/scripts
        run: npm install

      - name: Gửi thông báo
        working-directory: .github/scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NOTIFY_WINDOW: ${{ github.event.inputs.window }}
          FORCE_SEND: ${{ github.event.inputs.force_send }}
        run: node send-reminders.js
